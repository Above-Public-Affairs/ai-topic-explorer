name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma generate reads the config but never connects. Tests make no
      # network calls and need no API keys.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generated files tsc needs; both are gitignored.
      - run: npx prisma generate
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
